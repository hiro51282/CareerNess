  summary: Payment platform 刷新（2022-04〜2023-01）
  period: "2022-04 to 2023-01"
  company: 株式会社 Example
  description: |
    Payment service の刷新をリード。Python service から Go へ移行し、
    latency とコストを最適化。決済、platform、infra の 3 チーム（計 8 人）を調整。

    主な活動：
    - Go への移行方針を技術選定（type safety、performance、deployment 優位性）
    - CI/CD workflow の整理（15 個の job を 5 並列 stage に統合）
    - 3 チーム間の統一 API spec 策定をリード

    成果：
    - Latency 30% 削減（200ms → 140ms p99）
    - CI 実行時間 73% 削減（45 分 → 12 分）
    - コスト 15% 削減（リソース最適化）
    - チーム開発速度 +20% 向上（推定）
