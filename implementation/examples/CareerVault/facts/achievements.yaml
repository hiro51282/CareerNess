- fact_id: fact-ach-ci-optimization
  type: achievement
  status: confirmed
  summary: CI パイプライン最適化（45 分 → 12 分）
  description: |
    CI/CD workflow を再設計・統合。
    15 個の独立した job を 5 つの並列 stage に統合し、
    実行時間を 45 分から 12 分に削減（73% 改善）。

    実施内容：
    - Job 依存関係の分析と再構成
    - Caching 戦略の導入（依存関係 cache、build artifact cache）
    - Parallel execution の最適化
    - Flaky test の修正（安定性向上）

    運用上の効果：
    - Developer feedback loop が高速化
    - Release frequency が向上（1 日複数回可能に）
    - CI リソースコスト削減
  confidence: high
